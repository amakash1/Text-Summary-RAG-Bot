<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo4j Graph Visualization</title>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <style>
        #mynetwork {
            width: 100%;
            height: 600px;
            border: 1px solid lightgray;
        }
    </style>
</head>
<body>

<h2>Neo4j Graph Visualization</h2>
<div id="mynetwork"></div>

<script>
    var graphData = {
        nodes: [ /* PASTE JSON nodes here */ ],
        edges: [ /* PASTE JSON edges here */ ]
    };

    var nodes = new vis.DataSet(graphData.nodes);
    var edges = new vis.DataSet(graphData.edges);

    var container = document.getElementById('mynetwork');
    var data = { nodes: nodes, edges: edges };
    var options = { physics: { enabled: true } };
    new vis.Network(container, data, options);
</script>


</body>
</html>
